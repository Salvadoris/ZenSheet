<div class="p-2">
  <h2 mat-dialog-title class="text-lg font-semibold">
    <span class="inline-flex items-center gap-3">
      <i class="fas fa-palette text-2xl text-blue-500"></i>
      {{ data.title }}
    </span>
  </h2>

  <div mat-dialog-content>
    <div class="flex items-start gap-6">
      <div class="flex flex-col items-center gap-2">
        <p class="label-text font-medium text-gray-700 mb-2">Color preview</p>
        <button
          type="button"
          class="w-16 h-16 rounded-full border-2 border-gray-300 shadow-lg cursor-pointer hover:shadow-xl transition-shadow relative"
          [ngStyle]="previewStyle()"
          (click)="openColorPicker()"
          [attr.aria-label]="'Open color picker'">
          <input
            #colorInput
            type="color"
            class="absolute opacity-0 w-0 h-0 pointer-events-none"
            [value]="selectedColor()"
            (input)="onColorInput($event)" />
        </button>
        <input
          type="text"
          class="text-xs font-mono font-semibold text-gray-700 bg-gray-100 px-2 py-1 rounded text-center border-0 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-gray-50 w-20"
          [value]="selectedColor()"
          (input)="onHexInput($event)"
          placeholder="#000000"
          maxlength="7" />
      </div>

      <div class="h-24 w-px bg-gray-200 self-center"></div>

      <div class="flex-1">
        <p class="label-text font-medium text-gray-700 mb-2">Quick colors</p>
        <div class="grid grid-cols-4 gap-3 place-items-center mb-3">
          @for (color of data.defaultColors; track color) {
            <button
              type="button"
              class="color-swatch"
              [class.selected]="color === selectedColor()"
              [style.background]="color"
              (click)="selectColor(color)"
              [attr.aria-label]="'Select color ' + color">
              <i class="fas fa-check text-white text-sm"></i>
            </button>
          }
        </div>
      </div>
    </div>
  </div>

  <div mat-dialog-actions class="flex justify-between mt-5 gap-3">
    <button
      type="button"
      class="btn btn-ghost"
      (click)="this.dialogRef.close(null)">
      Cancel
    </button>
    <button
      type="submit"
      class="btn btn-primary"
      (click)="this.dialogRef.close(this.selectedColor())">
      Apply Color
    </button>
  </div>
</div>

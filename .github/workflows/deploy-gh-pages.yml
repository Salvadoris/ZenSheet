name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install dependencies
        run: cd Frontend && npm ci

      - name: Build Angular
        run: cd Frontend && npm run build -- --configuration gh.pages --base-href=/ZenSheet/

      - name: Fix SPA routing for GitHub Pages
        run: cp Frontend/dist/ZenSheet/browser/index.html Frontend/dist/ZenSheet/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Frontend/dist/ZenSheet/browser

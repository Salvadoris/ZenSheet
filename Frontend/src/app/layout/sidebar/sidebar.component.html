<button
  class="btn btn-ghost btn-square bg-gray-100 transition-all duration-300 ease-in-out"
  (click)="toggleSidebar()"
  [title]="isSidebarHidden ? 'Show sidebar' : 'Hide sidebar'"
  [ngClass]="isSidebarHidden ? 'rounded-xl' : 'rounded-t-lg rounded-b-none'">
  <i
    class="fas fa-chevron-down transition-transform duration-300"
    [ngClass]="isSidebarHidden ? '-rotate-90' : 'rotate-0'">
  </i>
</button>

<div
  class="bg-gray-100 w-64 p-4 flex flex-col transition-all duration-300 transform rounded-b-lg rounded-tr-lg rounded-tl-none min-h-1/2 absolute"
  [ngClass]="{
    'opacity-0 -translate-y-4 pointer-events-none scale-95 -z-10':
      isSidebarHidden,
    'opacity-100 translate-y-0 scale-100 z-10': !isSidebarHidden,
  }">
  @if (view === SidebarView.Folders) {
    <app-sidebar-header
      title="Folder overview"
      [buttons]="getFolderHeaderButtons()" />
    <hr class="border-t border-gray-300 my-3" />

    @if (loading()) {
      <div class="flex items-center justify-center py-6">
        <span class="loading loading-dots loading-xl text-primary"></span>
      </div>
    } @else {
      @for (folder of folders(); track folder.id) {
        <app-list-item
          [itemData]="getFolderListItemData(folder)"
          [menuItems]="getFolderMenuItems(folder)"
          (itemClicked)="selectFolder(folder)" />
      } @empty {
        <app-empty-state
          message="Looks like you haven't created any folders yet. Make one now!"
          icon="fa-folder" />
      }
    }
  } @else if (view === SidebarView.Notes) {
    <app-sidebar-header
      [title]="selectedFolder()?.name || ''"
      [titleColor]="selectedFolder()?.color"
      [showBackButton]="true"
      [buttons]="getNoteHeaderButtons()"
      (backClicked)="goBack()" />
    <hr class="border-t border-gray-300 my-3" />

    @for (note of selectedFolder()?.notes; track note.id) {
      <app-list-item
        [itemData]="getNoteListItemData(note)"
        [menuItems]="getNoteMenuItems(note)"
        (itemClicked)="selectNote(note)" 
        />
    } @empty {
      <app-empty-state
        message="No notes yet. Create your first one!"
        icon="fa-file" />
    }
  }
</div>

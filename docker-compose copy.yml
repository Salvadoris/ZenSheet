services:
  mongodb:
    image: mongo:latest
    container_name: zensheet-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - ${MONGO_DATA_PATH}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      dockerfile: ZenSheet.Api/Dockerfile
    container_name: zensheet-backend
    restart: always
    environment:
      - MONGO_HOST=mongodb
      - MONGO_DB=${MONGO_DB}
      - MONGO_USER=${MONGO_ROOT_USER}
      - MONGO_PASS=${MONGO_ROOT_PASSWORD}
      - MONGO_AUTH_SOURCE=admin
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT}:8080"

  frontend:
    build:
      dockerfile: Dockerfile
    container_name: zensheet-frontend
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    depends_on:
      - backend

volumes:
  mongo-data:

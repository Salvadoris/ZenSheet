<div
  class="flex flex-row gap-4 p-2 rounded-lg text-xl text-gray-500 bg-gray-100 shadow-md">
  <button
    class="rounded-lg hover:text-gray-100 hover:bg-gray-500"
    (click)="zoomOut()">
    <i class="fa-solid fa-minus"></i>
  </button>
  <div class="w-10 flex text-lg justify-center">
    <div>{{ Math.round(zoom * 100) }}%</div>
  </div>
  <button
    class="rounded-lg hover:text-gray-100 hover:bg-gray-500"
    (click)="zoomIn()">
    <i class="fa-solid fa-plus"></i>
  </button>
</div>

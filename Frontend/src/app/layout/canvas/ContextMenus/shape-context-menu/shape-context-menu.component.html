<div class="menu bg-base-200 rounded-box w-56 shadow-md">
  <ul>
    <li
      tabindex="0"
      (click)="executeAction.emit(ShapeContextMenuAction.Remove)">
      <button>Remove</button>
    </li>
    <li tabindex="0" (click)="executeAction.emit(ShapeContextMenuAction.Copy)">
      <button>Copy</button>
    </li>
    <li tabindex="0" (click)="executeAction.emit(ShapeContextMenuAction.Paste)">
      <button>Paste</button>
    </li>
    <li
      tabindex="0"
      (click)="executeAction.emit(ShapeContextMenuAction.Duplicate)">
      <button>Duplicate</button>
    </li>
    @if (isMultiShape()) {
      <div class="h-px bg-gray-300 my-1"></div>
      <li
        tabindex="0"
        (click)="executeAction.emit(ShapeContextMenuAction.Group)">
        <button>Group</button>
      </li>
    } @else if (isGroup()) {
      <div class="h-px bg-gray-300 my-1"></div>
      <li
        tabindex="0"
        (click)="executeAction.emit(ShapeContextMenuAction.SplitGroup)">
        <button>Split Group</button>
      </li>
    }
    <div class="h-px bg-gray-300 my-1"></div>
    <li
      tabindex="0"
      (click)="executeAction.emit(ShapeContextMenuAction.MoveForward)">
      <button>Move Forward</button>
    </li>
    <li
      tabindex="0"
      (click)="executeAction.emit(ShapeContextMenuAction.MoveBackwards)">
      <button>Move Backwards</button>
    </li>
    <li
      tabindex="0"
      (click)="executeAction.emit(ShapeContextMenuAction.MoveToFront)">
      <button>Move to Front</button>
    </li>
    <li
      tabindex="0"
      (click)="executeAction.emit(ShapeContextMenuAction.MoveToBack)">
      <button>Move to Back</button>
    </li>
  </ul>
</div>

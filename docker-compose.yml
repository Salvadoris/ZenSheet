services:
  mongodb:
    image: mongo:latest
    container_name: zensheet-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - ${MONGO_DATA_PATH}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: ZenSheet.Api/Dockerfile
    image: zensheet-backend:latest
    container_name: zensheet-backend
    restart: always
    environment:
      - MONGO_HOST=mongodb
      - MONGO_DB=${MONGO_DB}
      - MONGO_USER=${MONGO_ROOT_USER}
      - MONGO_PASS=${MONGO_ROOT_PASSWORD}
      - MONGO_AUTH_SOURCE=admin
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/ZenSheet.Api.pfx
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT}:8080"
      - "${BACKEND_HOST_HTTPS_PORT}:8081"
    volumes:
      - ./.certs:/https:ro

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: zensheet-frontend:latest
    environment:
      NODE_ENV: production
    container_name: zensheet-frontend
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT}:80"
      - "${FRONTEND_HOST_HTTPS_PORT}:443"
    depends_on:
      - backend


<div class="flex h-screen">
  <app-sidebar
    class="relative p-5"
    (noteSelected)="onNoteSelected($event.note)">
  </app-sidebar>

  <div class="flex-1 flex flex-col p-4 gap-1">
    @if (selectedNote()) {
      <app-toolbar class="self-center"></app-toolbar>
      <div class="flex-1 overflow-y-auto">
        <app-editor [note]="selectedNote()!"></app-editor>
      </div>
    } @else {
      <div class="flex-1 flex items-center justify-center">
        <div class="text-center text-gray-500">
          @if (hasNotes()) {
            <h2 class="text-2xl font-semibold mb-2">
              Select a note to start editing
            </h2>
            <p class="text-lg">
              Choose a note from the sidebar to begin writing
            </p>
          } @else {
            <h2 class="text-2xl font-semibold mb-2">No notes yet</h2>
            <p class="text-lg">
              Create your first folder and note to get started
            </p>
          }
        </div>
      </div>
    }
  </div>
</div>

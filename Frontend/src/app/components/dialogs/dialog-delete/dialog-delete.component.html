<div class="relative overflow-hidden rounded-2xl bg-base-100 shadow-2xl">
  <div
    class="absolute top-0 left-0 right-0 h-2 bg-linear-to-r from-error to-warning opacity-80"></div>

  <div class="p-8">
    <div class="mb-4 flex justify-center">
      <div
        class="flex h-20 w-20 items-center justify-center rounded-2xl bg-error/10 text-error shadow-inner">
        <i
          class="fas text-4xl"
          [class]="
            data.itemType === 'folder' ? 'fa-folder-minus' : 'fa-trash-alt'
          "></i>
      </div>
    </div>

    <div class="text-center">
      <h2 mat-dialog-title class="mb-2 text-2xl font-bold tracking-tight text-base-content">
        {{ data.title }}
      </h2>
      <p class="px-4 text-base text-base-content/70">
        {{ data.message }}
      </p>
    </div>

    <div class="mt-8 overflow-hidden rounded-xl border border-base-200 bg-base-200/50 p-4 transition-all hover:bg-base-200">
      <div class="flex items-center gap-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-base-100 shadow-sm">
          <i
            class="fas text-xl"
            [ngClass]="{
              'fa-folder text-warning': data.itemType === 'folder',
              'fa-file-alt text-info': data.itemType === 'note',
            }"></i>
        </div>
        <div class="flex flex-col">
          <span class="text-xs font-semibold uppercase tracking-wider text-base-content/50">
            Deleting {{ data.itemType }}
          </span>
          <span class="truncate text-lg font-bold text-base-content">
            {{ data.itemName }}
          </span>
        </div>
      </div>
    </div>

    @if (data.itemType === 'folder') {
      <div
        class="mt-4 flex items-start gap-3 rounded-lg bg-warning/10 p-4 text-warning-content border border-warning/20">
        <i class="fas fa-exclamation-triangle mt-1 text-warning"></i>
        <div class="text-sm font-medium leading-tight">
          <span class="font-bold">Warning:</span> This will permanently delete all contents within this folder. This action cannot be undone.
        </div>
      </div>
    }

    <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
      <button
        class="btn btn-ghost order-2 sm:order-1 sm:flex-1"
        (click)="onCancel()"
        type="button">
        Keep it
      </button>
      <button
        class="btn btn-error order-1 sm:order-2 sm:flex-1 shadow-lg shadow-error/20"
        (click)="onConfirm()"
        type="button">
        Confirm Delete
      </button>
    </div>
  </div>
</div>

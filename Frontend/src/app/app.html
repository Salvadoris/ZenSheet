<div class="flex h-screen">
  <app-canvas #canvas></app-canvas>
  <app-sidebar
    class="relative p-5"
    (noteSelected)="onNoteSelected($event.note)">
  </app-sidebar>
  <div class="flex-1 flex flex-col p-4 gap-1">
    <app-toolbar
      class="self-center z-1"
      (modeChange)="canvas.changeMode($event)"></app-toolbar>
  </div>
</div>
